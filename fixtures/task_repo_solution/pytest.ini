# Standalone pytest config for the loglens fixture repo.
#
# Its presence makes this directory pytest's rootdir, so the suite is fully
# independent of any parent project configuration.
[pytest]
testpaths = tests
pythonpath = .
# The cache would otherwise write .pytest_cache/ into the working tree and
# perturb workdir snapshots between runs.
addopts = -p no:cacheprovider
