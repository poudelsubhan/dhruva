[project]
name = "dhruva"
version = "0.1.0"
description = "Dhruva — agent supervisor: goal-state checkpointing, semantic drift detection, rollback."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
    "anthropic>=0.40",
    "openai>=1.55",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-jsonschema",
    "datamodel-code-generator>=0.26",
    "python-pptx>=1.0.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fixtures/task_repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["fixtures/task_repo", "\\.venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend"]
python_files = ["test_*.py"]
addopts = "-q"
